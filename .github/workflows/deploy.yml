name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 非機密：已部署好的 Cloudflare Worker 網址（見 cloudflare-worker/）。
          # 設定路徑：repo Settings → Secrets and variables → Actions →
          # Variables → New repository variable，名稱需為 VITE_METRO_API_BASE_URL。
          # 未設定時建置出來的網站會自動維持在 Demo Mode。
          VITE_METRO_API_BASE_URL: ${{ vars.VITE_METRO_API_BASE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
