<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metro Quest — Taipei Metro Real-Time Control Center</title>
    <meta
      name="description"
      content="Taipei Metro real-time train tracking dashboard featuring an 8-bit retro game style map and live railway operations visualization."
    />
    <meta name="theme-color" content="#0b1035" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="METRO QUEST" />
    <meta property="og:title" content="METRO QUEST — Taipei Metro Real-Time Control Center" />
    <meta
      property="og:description"
      content="台北捷運即時列車行控中心：8-bit 復古遊戲世界地圖 × 台北捷運路網 × 即時列車追蹤。"
    />
    <meta property="og:url" content="https://wahaha232.github.io/MRTTRACKER/" />
    <!-- Open Graph 要求 og:image 必須是完整絕對網址（https://...）；
         社群爬蟲（Facebook/LINE/Twitter 等）不會自行補全相對路徑，
         故不可使用 %BASE_URL% 這種會被替換成 /MRTTRACKER/ 相對路徑的寫法。 -->
    <meta property="og:image" content="https://wahaha232.github.io/MRTTRACKER/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="METRO QUEST — Taipei Metro Real-Time Control Center" />
    <meta
      name="twitter:description"
      content="Taipei Metro real-time train tracking dashboard featuring an 8-bit retro game style map."
    />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
